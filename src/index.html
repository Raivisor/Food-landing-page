<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>landing</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald&display=swap" rel="stylesheet">
    <script src="../src/js/app.js" defer></script>
</head>
<body>
    <header class="main-header">
        <div class="layers">
            <div class="layers__header">
                <h1 class="header">Добро пожаловать в "Ароматный круг"!</h1>
                <div class="header__p">Здесь вы сможете узнать новые рецепты из многих национальных кухонь</div>
                <button class="header__button" id="header__button">Поехали!</button>
            </div>
            <div class="header__image" style="background-image: url(img/bg-image.jpeg);"></div>
        </div>
    </header>
    <section class="main-cuisins" id="c">
        <div class="cuisins__header">
            <h2 class="header">Национальные кухни</h2>
        </div>
        <div class="row-cuisins">
            <div class="container">
                <img src="img/russian-cuisin.jpg">
                <p>Русская кухня</p>
            </div>
            <div class="container">
                <img src="img/japanese-cuisin.jpg">
                <p>Японская кухня</p>
            </div>
            <div class="container">
                <img src="img/american-cuisin.jpg">
                <p>Американская кухня</p>
            </div>
            <div class="container">
                <img src="img/italian-cuisin.jpg">
                <p>Итальянская кухня</p>
            </div>
        </div>
        <div class="row-cuisins">
            <div class="container">
                <img src="img/french-cuisin.jpg">
                <p>Французская кухня</p>
            </div>
            <div class="container">
                <img src="img/mecsican-cuisin.jpg">
                <p>Мексиканская кухня</p>
            </div>
            <div class="container">
                <img src="img/asian-cuisin.jpg">
                <p>Азиатская кухня</p>
            </div>
            <div class="container">
                <img src="img/georgian-cuisin.jpg">
                <p>Грузинская кухня</p>
            </div>
        </div>
    </section>
</body>
</html>
